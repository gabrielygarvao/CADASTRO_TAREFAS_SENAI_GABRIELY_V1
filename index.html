<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu paineil de tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="cartao-aplicacao">
        <header class="cabecalho-aplicacao">
            <h1>Tarefas da Mia (^・ω・^)    </h1>
            <button id="botao-tema" class="botao-principal">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>
        <div class="caixa-entrada">
            <input type="text" id="campo-tarefa" placeholder="O que a mia vai fazer hoje? . . ." maxlength="40">
            <button id="botao-adicionar" class="botao-principal">
                <i class="fa-solid fa-plus"></i>  Adicionar</button>
        </div>
        <ul id="lista-tarefas" class="lista-tarefas">
            <!-- As tarefas serão inseridas aqui dinamicamente via JS -->
        </ul>
        <button id="botao-limpar" onclick="limparConcluidas()">Limpar tarefas concluídas</button>        
        <footer class="rodape-aplicacao">

            <span id="contador-tarefas">0 tarefas na lista</span>

            
            <img src="mia.jpg" alt="mia" class="foto-pequena">
            <span id="textogaby">Mãe da Mia: </span>
            <img src="biavermelho.jpg" alt="bia/gaby" class="foto-pequena">
        </footer>
        <button id="botao-aviso" onclick="mostrarAviso()">Ver alterações</button>

    <script src="script.js"></script>
</body>

</html>
